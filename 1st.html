
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도 학교·도서관 지도</title>

    <style>
        /* 전체 화면의 기본 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Malgun Gothic", sans-serif;
            color: #263238;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 360px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-right: 1px solid #dddddd;
            z-index: 2;
        }

        .header {
            padding: 22px 20px 16px;
            background: #f3f8fc;
            border-bottom: 1px solid #e0e7ed;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .header p {
            margin: 0;
            font-size: 12px;
            line-height: 1.6;
            color: #60717d;
        }

        .filters {
            padding: 18px 20px;
            border-bottom: 1px solid #eeeeee;
        }

        .filters label.title {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 11px;
            margin-bottom: 17px;
            border: 1px solid #d5dce2;
            border-radius: 7px;
            background: white;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px 12px;
            border: 1px solid #e0e5e9;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .checkbox-option input {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: #477dba;
        }

        .school-dot,
        .library-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }

        .school-dot {
            background: #63c5f2;
        }

        .library-dot {
            background: #9bd85b;
        }

        .status {
            padding: 12px 20px;
            background: #fafbfd;
            color: #657681;
            font-size: 12px;
            line-height: 1.6;
            border-bottom: 1px solid #eeeeee;
        }

        .result-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px 10px;
        }

        .result-heading h2 {
            margin: 0;
            font-size: 15px;
        }

        .result-count {
            color: #667985;
            font-size: 12px;
        }

        .result-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 16px;
        }

        .result-item {
            padding: 13px 10px;
            border-bottom: 1px solid #edf0f2;
            cursor: pointer;
            border-radius: 6px;
        }

        .result-item:hover {
            background: #f3f8fc;
        }

        .result-name {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .result-type {
            display: inline-block;
            margin-right: 5px;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: normal;
        }

        .school-label {
            color: #176b94;
            background: #dff4ff;
        }

        .library-label {
            color: #3f7020;
            background: #e9f8d9;
        }

        .result-address {
            color: #78858d;
            font-size: 11px;
            line-height: 1.5;
        }

        /* 오른쪽 지도 영역 */
        .map-area {
            position: relative;
            flex: 1;
            min-width: 0;
            background: #edf2f4;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-legend {
            position: absolute;
            z-index: 1;
            top: 15px;
            right: 15px;
            padding: 12px 15px;
            background: white;
            border-radius: 9px;
            box-shadow: 0 2px 9px #00000018;
            font-size: 12px;
            line-height: 2;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .loading-message {
            padding: 25px 12px;
            color: #7b8790;
            font-size: 13px;
            text-align: center;
            line-height: 1.7;
        }

        /* 휴대전화 화면 대응 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                min-height: 250px;
                border-right: none;
                border-bottom: 1px solid #dddddd;
            }

            .header {
                padding: 12px 15px;
            }

            .header h1 {
                font-size: 17px;
            }

            .filters {
                padding: 12px 15px;
            }

            .filters select {
                margin-bottom: 10px;
            }

            .status {
                padding: 8px 15px;
            }

            .result-heading {
                padding: 10px 15px;
            }

            .map-area {
                flex: 1;
                min-height: 180px;
            }

            .map-legend {
                top: 8px;
                right: 8px;
                padding: 7px 10px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <!-- 왼쪽 검색 패널 -->
    <aside class="sidebar">
        <header class="header">
            <h1>경기도 학교·도서관 지도</h1>
            <p>
                경기도 내 중·고등학교와 도서관의 위치를
                지도에서 확인할 수 있어.
            </p>
        </header>

        <section class="filters">
            <label class="title" for="citySelect">지역 선택</label>

            <select id="citySelect">
                <option value="">경기도 전체</option>
            </select>

            <label class="title">검색 대상</label>

            <div class="checkbox-group">
                <label class="checkbox-option">
                    <input type="checkbox" id="schoolCheck" checked>
                    <span class="school-dot"></span>
                    중·고등학교
                </label>

                <label class="checkbox-option">
                    <input type="checkbox" id="libraryCheck" checked>
                    <span class="library-dot"></span>
                    도서관
                </label>
            </div>
        </section>

        <div class="status" id="status">
            지도를 준비하고 있어.
        </div>

        <div class="result-heading">
            <h2>검색 결과</h2>
            <span class="result-count" id="resultCount">0곳</span>
        </div>

        <div class="result-list" id="resultList">
            <div class="loading-message">
                지도와 검색 기능을 준비하고 있어.
            </div>
        </div>
    </aside>

    <!-- 오른쪽 지도 패널 -->
    <main class="map-area">
        <div id="map"></div>

        <div class="map-legend">
            <div class="legend-item">
                <span class="school-dot"></span>
                중·고등학교
            </div>
            <div class="legend-item">
                <span class="library-dot"></span>
                도서관
            </div>
        </div>
    </main>
</div>

<!-- 카카오맵 SDK -->
<script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=57ef9bb08de92bce05226eb47898fc02&libraries=services&autoload=false"
    onerror="document.getElementById('status').textContent='카카오맵 SDK를 불러오지 못했어. API 키와 네트워크를 확인해 줘.'">
</script>

<script>
    // 경기도 시·군별 중심 좌표
    const cityCenters = {
        "수원시": [37.2636, 127.0286],
        "성남시": [37.4200, 127.1265],
        "의정부시": [37.7381, 127.0337],
        "안양시": [37.3943, 126.9568],
        "부천시": [37.5034, 126.7660],
        "광명시": [37.4786, 126.8644],
        "평택시": [36.9921, 127.1129],
        "동두천시": [37.9035, 127.0606],
        "안산시": [37.3219, 126.8309],
        "고양시": [37.6584, 126.8320],
        "과천시": [37.4292, 126.9876],
        "구리시": [37.5943, 127.1295],
        "남양주시": [37.6360, 127.2165],
        "오산시": [37.1498, 127.0775],
        "시흥시": [37.3800, 126.8029],
        "군포시": [37.3616, 126.9352],
        "의왕시": [37.3449, 126.9683],
        "하남시": [37.5393, 127.2148],
        "용인시": [37.2411, 127.1776],
        "파주시": [37.7600, 126.7800],
        "이천시": [37.2720, 127.4350],
        "안성시": [37.0080, 127.2797],
        "김포시": [37.6153, 126.7156],
        "화성시": [37.1995, 126.8312],
        "광주시": [37.4294, 127.2551],
        "양주시": [37.7853, 127.0458],
        "포천시": [37.8949, 127.2003],
        "여주시": [37.2983, 127.6374],
        "연천군": [38.0964, 127.0751],
        "가평군": [37.8315, 127.5095],
        "양평군": [37.4917, 127.4875]
    };

    // 카카오맵에서 사용하는 색상
    const colors = {
        school: "#63C5F2",
        library: "#9BD85B"
    };

    let map;
    let placesService;
    let infoWindow;
    let markers = [];

    // 검색 결과를 장소 ID 기준으로 중복 없이 보관
    let placesData = new Map();

    // 새 검색이 시작되면 이전 검색을 무효화
    let searchVersion = 0;

    const citySelect = document.getElementById("citySelect");
    const schoolCheck = document.getElementById("schoolCheck");
    const libraryCheck = document.getElementById("libraryCheck");
    const statusElement = document.getElementById("status");
    const resultList = document.getElementById("resultList");
    const resultCount = document.getElementById("resultCount");

    // 시·군 선택 목록 생성
    Object.keys(cityCenters)
        .sort((a, b) => a.localeCompare(b, "ko"))
        .forEach(city => {
            const option = document.createElement("option");
            option.value = city;
            option.textContent = city;
            citySelect.appendChild(option);
        });

    // 카카오맵 SDK가 준비된 뒤 지도 초기화
    window.addEventListener("load", function () {
        if (!window.kakao || !kakao.maps) {
            statusElement.textContent =
                "지도 SDK를 사용할 수 없어. API 키와 도메인 설정을 확인해 줘.";
            return;
        }

        kakao.maps.load(function () {
            initializeMap();
        });
    });

    function initializeMap() {
        // 기본 위치는 경기도청 부근
        const defaultCenter = new kakao.maps.LatLng(
            37.2750, 127.0095
        );

        map = new kakao.maps.Map(
            document.getElementById("map"),
            {
                center: defaultCenter,
                level: 5
            }
        );

        placesService = new kakao.maps.services.Places(map);
        infoWindow = new kakao.maps.InfoWindow({ zIndex: 3 });

        statusElement.textContent =
            "지도 준비 완료. 검색할 지역과 대상을 선택해 줘.";

        // 현재 위치 권한 요청
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    statusElement.textContent =
                        "현재 위치를 중심으로 지도를 표시했어.";

                    runSearch();
                },
                function () {
                    statusElement.textContent =
                        "현재 위치를 사용할 수 없어. 경기도 중심에서 검색할게.";

                    map.setCenter(defaultCenter);
                    runSearch();
                },
                {
                    enableHighAccuracy: false,
                    timeout: 8000,
                    maximumAge: 60000
                }
            );
        } else {
            statusElement.textContent =
                "위치 기능을 지원하지 않아. 경기도 중심에서 검색할게.";

            runSearch();
        }
    }

    // 필터가 바뀌면 검색을 다시 실행
    citySelect.addEventListener("change", runSearch);
    schoolCheck.addEventListener("change", runSearch);
    libraryCheck.addEventListener("change", runSearch);

    function runSearch() {
        if (!map || !placesService) return;

        const version = ++searchVersion;

        // 이전 마커와 검색 결과 제거
        clearMarkers();
        placesData.clear();
        renderResults();

        const selectedCity = citySelect.value;
        const categories = [];

        if (schoolCheck.checked) {
            categories.push({
                type: "school",
                code: "SC4"
            });
        }

        if (libraryCheck.checked) {
            categories.push({
                type: "library",
                code: "CT1"
            });
        }

        if (categories.length === 0) {
            statusElement.textContent =
                "학교 또는 도서관을 하나 이상 선택해 줘.";
            return;
        }

        const cities = selectedCity
            ? [selectedCity]
            : Object.keys(cityCenters);

        // 지역별 검색 작업을 순서대로 실행
        const tasks = [];

        cities.forEach(city => {
            categories.forEach(category => {
                tasks.push({
                    city: city,
                    type: category.type,
                    code: category.code
                });
            });
        });

        let completedTasks = 0;
        let foundPlaces = 0;

        statusElement.textContent =
            `검색 준비 중: ${tasks.length}개 지역·분류 작업`;

        function processTask(index) {
            // 사용자가 필터를 변경했다면 이전 검색은 중단
            if (version !== searchVersion) return;

            if (index >= tasks.length) {
                renderResults();

                statusElement.textContent =
                    `검색 완료. 검색 결과 ${foundPlaces}곳을 확인했어. ` +
                    "카카오맵에 등록된 장소만 표시돼.";

                return;
            }

            const task = tasks[index];
            const center = cityCenters[task.city];

            const location = new kakao.maps.LatLng(
                center[0], center[1]
            );

            // 카테고리 검색은 반경 최대 20km까지 지정 가능
            searchCategory(
                task,
                location,
                version,
                function (count) {
                    if (version !== searchVersion) return;

                    foundPlaces += count;
                    completedTasks++;

                    statusElement.textContent =
                        `검색 중 ${completedTasks}/${tasks.length} · ` +
                        `현재 ${placesData.size}곳`;

                    // API 요청을 한꺼번에 보내지 않도록 간격을 둠
                    setTimeout(function () {
                        processTask(index + 1);
                    }, 120);
                }
            );
        }

        processTask(0);
    }

    // 카테고리 검색과 페이지 이동
    function searchCategory(task, location, version, done) {
        let page = 1;
        let addedCount = 0;

        function requestPage() {
            if (version !== searchVersion) return;

            placesService.categorySearch(
                task.code,
                function (data, status, pagination) {
                    if (version !== searchVersion) return;

                    if (status === kakao.maps.services.Status.OK) {
                        data.forEach(place => {
                            if (!isInGyeonggi(place)) return;
                            if (!matchesType(place, task.type)) return;

                            const key = place.id ||
                                `${place.place_name}_${place.x}_${place.y}`;

                            if (!placesData.has(key)) {
                                placesData.set(key, {
                                    ...place,
                                    type: task.type
                                });

                                addedCount++;
                            }
                        });

                        // 카카오맵 카테고리 검색의 최대 페이지 범위 내에서 조회
                        if (pagination.hasNextPage && page < 45) {
                            page++;

                            setTimeout(requestPage, 120);
                        } else {
                            done(addedCount);
                        }
                    } else {
                        // 결과 없음 또는 API 오류
                        done(addedCount);
                    }
                },
                {
                    location: location,
                    radius: 20000,
                    size: 15,
                    page: page,
                    sort: kakao.maps.services.SortBy.ACCURACY
                }
            );
        }

        requestPage();
    }

    // 검색 결과의 주소가 경기도인지 확인
    function isInGyeonggi(place) {
        const address =
            place.address_name || place.road_address_name || "";

        return address.includes("경기도") ||
            address.includes("경기 ");
    }

    // 카테고리 결과 중 원하는 장소만 선별
    function matchesType(place, type) {
        const name = place.place_name || "";
        const category = place.category_name || "";

        if (type === "school") {
            // 초등학교가 아닌 중학교·고등학교만 표시
            return /중학교|고등학교|중고등학교|중·고등학교/.test(name);
        }

        if (type === "library") {
            // CT1은 문화시설 전체이므로 도서관 명칭을 추가로 확인
            return /도서관|어린이도서관|작은도서관/.test(name) ||
                /도서관/.test(category);
        }

        return false;
    }

    // 지도에 표시된 마커 제거
    function clearMarkers() {
        markers.forEach(marker => marker.setMap(null));
        markers = [];

        if (infoWindow) {
            infoWindow.close();
        }
    }

    // 검색 결과를 목록과 지도에 표시
    function renderResults() {
        clearMarkers();
        resultList.replaceChildren();

        const selectedTypes = [];

        if (schoolCheck.checked) selectedTypes.push("school");
        if (libraryCheck.checked) selectedTypes.push("library");

        const results = Array.from(placesData.values())
            .filter(place => selectedTypes.includes(place.type))
            .sort((a, b) =>
                a.place_name.localeCompare(b.place_name, "ko")
            );

        resultCount.textContent = `${results.length}곳`;

        if (results.length === 0) {
            const message = document.createElement("div");
            message.className = "loading-message";
            message.textContent =
                "검색 결과가 없어. 다른 지역이나 검색 대상을 선택해 줘.";
            resultList.appendChild(message);
            return;
        }

        results.forEach(place => {
            const item = document.createElement("div");
            item.className = "result-item";

            const name = document.createElement("div");
            name.className = "result-name";

            const label = document.createElement("span");
            label.className = "result-type " +
                (place.type === "school"
                    ? "school-label"
                    : "library-label");

            label.textContent =
                place.type === "school" ? "학교" : "도서관";

            name.appendChild(label);
            name.appendChild(document.createTextNode(place.place_name));

            const address = document.createElement("div");
            address.className = "result-address";
            address.textContent =
                place.road_address_name || place.address_name || "주소 정보 없음";

            item.appendChild(name);
            item.appendChild(address);

            item.addEventListener("click", function () {
                const position = new kakao.maps.LatLng(
                    Number(place.y), Number(place.x)
                );

                map.panTo(position);

                infoWindow.setContent(
                    `<div style="padding:8px;font-size:12px;white-space:nowrap;">` +
                    `${escapeHTML(place.place_name)}</div>`
                );

                // 해당 장소의 마커를 찾아 정보 창 표시
                const marker = markers.find(
                    item => item.placeId === place.id
                );

                if (marker) {
                    infoWindow.open(map, marker);
                }
            });

            resultList.appendChild(item);

            // 학교와 도서관의 마커 색상을 다르게 설정
            const markerColor = colors[place.type];

            const markerContent = document.createElement("div");
            markerContent.style.width = "15px";
            markerContent.style.height = "15px";
            markerContent.style.backgroundColor = markerColor;
            markerContent.style.border = "2px solid white";
            markerContent.style.borderRadius = "50%";
            markerContent.style.boxShadow = "0 1px 4px #0005";

            const marker = new kakao.maps.CustomOverlay({
                position: new kakao.maps.LatLng(
                    Number(place.y), Number(place.x)
                ),
                content: markerContent,
                yAnchor: 0.5,
                zIndex: place.type === "school" ? 2 : 3
            });

            marker.setMap(map);
            marker.placeId = place.id;
            markers.push(marker);

            // 마커를 누르면 장소명 정보 창 표시
            markerContent.style.cursor = "pointer";

            markerContent.addEventListener("click", function () {
                infoWindow.setContent(
                    `<div style="padding:8px;font-size:12px;white-space:nowrap;">` +
                    `${escapeHTML(place.place_name)}</div>`
                );

                infoWindow.setPosition(
                    new kakao.maps.LatLng(
                        Number(place.y), Number(place.x)
                    )
                );

                infoWindow.open(map);
            });
        });
    }

    // 장소명에 포함된 HTML 문자를 안전하게 변환
    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function (character) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[character];
        });
    }
</script>
